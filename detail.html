    <!-- =============== Header ============== -->
    <header>

      >
        <div class="flex items-center gap-3">
          <!-- Logo on Mobile -->

          <!-- Logo on Desktop -->

            class="hidden lg:block"
            src="public/img/site-logo-desktop.PNG"
            alt=""
          />
          <ul class="flex items-center gap-2 md:gap-5 text-[14px] font-medium">
            <li>لیست استخرها</li>
            <li>بلاگ</li>
            <!-- li On Desktop -->

            <li class="hidden lg:block">ارتباط با ما</li>

        </div>
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5">
            <use href="#moon"></use>
          </svg>
          <div class="flex items-center gap-2 text-[14px] font-medium">
            <svg class="w-5 h-5">

            <p>ورود</p>
          </div>
        </div>
      </section>

            <!-- Slider main container -->

                <!-- Slides -->

                <div class="swiper-slide  bg-gray-300">
                  <img class="slide-img  w-full h-full" src="" alt="">

                <!-- 2/6 -->

                <!-- 3/6 -->

                </div>
                <!-- 4/6 -->

                </div>
                <!-- 5/6 -->

                </div>
                <!-- 6/6 -->
                <div class="swiper-slide bg-gray-300">
                  <img class="slide-img  w-full h-full" src="" alt="">
                </div>
                ...
              </div>
              <!-- If we need pagination -->
              <div class="swiper-pagination"></div>
          
              <!-- If we need navigation buttons -->
              <div class="swiper-button-prev  invisible"></div>
              <div class="swiper-button-next  invisible" ></div>
          
              <!-- If we need scrollbar -->
              <div class="swiper-scrollbar  invisible"></div>

            <!-- Context -->

                  استخر دریا

                    <use href="#location"></use>
                  </svg>
                  <p class="address">قم | بلوار خلیج فارس</p>
                </div>

                <div class="tel-phone flex items-center gap-2 mt-3 text-[14px]">
                  <svg class="w-5 h-5">
                    <use href="#phone"></use>
                  </svg>
                  <p class="phone-num">12345</p>
                </div>
                <!-- Rate -->
                <div class="flex items-center gap-2  sm:justify-between border-b border-gray-500 pb-3">
                    <div class="flex items-center gap-2">
                        <!-- stars -->

                            <!-- 2/5 -->

                            </svg>

                            </svg>

                            </svg>

                            </svg>
                        </div>
                        <div class="w-8 h-8 flex items-center justify-center border border-blue-800 rounded-md">

                                <use href="#location"></use>
                            </svg>
                        </div>
                        <div class="w-8 h-8 flex items-center justify-center border border-blue-800 rounded-md">
                            <svg class="w-5 h-5">
                                <use href="#heart"></use>
                            </svg>
                        </div>
                    </div>

                </div>
                <!-- Acceptance -->
                    <div class="border-b border-gray-500 pb-5 mt-5 lg:flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-gray-400 rounded-full text-blue-900 flex items-center justify-center">
                                <svg class="w-10 h-10">

                                </svg>
                            </div>
                            <div>
                                <p>نوع پذیرش</p>

                            </div>

                        <div  class="flex items-center gap-3 mt-5 lg:mt-0">

                            <div>
